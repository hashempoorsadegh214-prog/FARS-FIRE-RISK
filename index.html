<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>سامانه پایش و پیش‌بینی خطر حریق استان فارس</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <style>

        @font-face {
            font-family: "BNazanin";
            src: local("B Nazanin");
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: "BNazanin", Tahoma, Arial, sans-serif;
            background: #f4f4f4;
        }

        header {
            height: 70px;
            background: #f57c00;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: relative;
            z-index: 2000;
            box-shadow: 0 2px 8px rgba(0,0,0,0.25);
        }

        header h1 {
            margin: 0;
            font-size: 25px;
            font-weight: bold;
        }

        header .subtitle {
            margin-top: 3px;
            font-size: 14px;
        }

        #map {
            width: 100%;
            height: calc(100vh - 70px);
        }

        .control-panel {
            position: absolute;
            top: 85px;
            right: 15px;
            z-index: 1500;
            width: 245px;
            background: rgba(255,255,255,0.97);
            border-radius: 12px;
            padding: 14px;
            box-shadow: 0 3px 14px rgba(0,0,0,0.25);
        }

        .panel-title {
            font-size: 17px;
            font-weight: bold;
            margin-bottom: 10px;
            border-bottom: 1px solid #ddd;
            padding-bottom: 8px;
        }

        .filter-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 9px 0;
            font-size: 15px;
            cursor: pointer;
        }

        .filter-row input {
            width: 17px;
            height: 17px;
            cursor: pointer;
        }

        .legend {
            position: absolute;
            left: 15px;
            top: 85px;
            z-index: 1500;
            background: rgba(255,255,255,0.97);
            border-radius: 12px;
            padding: 13px;
            width: 230px;
            box-shadow: 0 3px 14px rgba(0,0,0,0.25);
        }

        .legend-title {
            font-weight: bold;
            font-size: 17px;
            margin-bottom: 9px;
            border-bottom: 1px solid #ddd;
            padding-bottom: 7px;
        }

        .legend-row {
            display: flex;
            align-items: center;
            margin: 6px 0;
            font-size: 14px;
        }

        .legend-color {
            width: 27px;
            height: 16px;
            margin-left: 8px;
            border-radius: 3px;
            border: 1px solid #999;
        }

        .low {
            background: #2ca25f;
        }

        .moderate {
            background: #ffff00;
        }

        .high {
            background: #ff9900;
        }

        .very-high {
            background: #ff0000;
        }

        .severe {
            background: #cc00cc;
        }

        .very-severe {
            background: #7a001f;
        }

        .fars-button {
            position: absolute;
            bottom: 25px;
            right: 15px;
            z-index: 1500;
            border: none;
            background: white;
            padding: 9px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-family: inherit;
            font-size: 14px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.25);
        }

        .fars-button:hover {
            background: #f57c00;
            color: white;
        }

        .leaflet-popup-content {
            font-family: "BNazanin", Tahoma, Arial, sans-serif;
            font-size: 15px;
            line-height: 1.8;
            min-width: 220px;
        }

        .popup-title {
            font-size: 18px;
            font-weight: bold;
            color: #e65100;
            margin-bottom: 5px;
        }

        .popup-row {
            border-bottom: 1px solid #eee;
            padding: 3px 0;
        }

        @media (max-width: 700px) {

            header {
                height: 62px;
            }

            header h1 {
                font-size: 18px;
            }

            header .subtitle {
                font-size: 10px;
            }

            #map {
                height: calc(100vh - 62px);
            }

            .control-panel {
                top: 72px;
                right: 8px;
                width: 190px;
                padding: 10px;
            }

            .legend {
                top: 72px;
                left: 8px;
                width: 180px;
                padding: 10px;
            }

            .panel-title,
            .legend-title {
                font-size: 14px;
            }

            .filter-row,
            .legend-row {
                font-size: 12px;
            }

            .fars-button {
                right: 8px;
                bottom: 20px;
            }
        }

    </style>
</head>

<body>

<header>
    <div>
        <h1>سامانه پایش و پیش‌بینی خطر حریق استان فارس</h1>

        <div class="subtitle">
            ECMWF Fire Weather Index — GWIS
        </div>
    </div>
</header>


<!-- ==============================
     پنل فیلترها
================================ -->

<div class="control-panel">

    <div class="panel-title">
        لایه‌های مکانی
    </div>

    <label class="filter-row">

        <input
            type="checkbox"
            id="fwiToggle"
            checked
        >

        نمایش خطر حریق FWI

    </label>

    <label class="filter-row">

        <input
            type="checkbox"
            id="protectedToggle"
        >

        مناطق چهارگانه

    </label>

    <label class="filter-row">

        <input
            type="checkbox"
            id="huntingToggle"
        >

        مناطق شکار ممنوع

    </label>

    <label class="filter-row">

        <input
            type="checkbox"
            id="farsToggle"
            checked
        >

        مرز استان فارس

    </label>

</div>


<!-- ==============================
     راهنمای FWI
================================ -->

<div class="legend">

    <div class="legend-title">
        طبقات خطر حریق FWI
    </div>

    <div class="legend-row">
        <span class="legend-color low"></span>
        کم — کمتر از 11.2
    </div>

    <div class="legend-row">
        <span class="legend-color moderate"></span>
        متوسط — 11.2 تا کمتر از 21.3
    </div>

    <div class="legend-row">
        <span class="legend-color high"></span>
        زیاد — 21.3 تا کمتر از 38
    </div>

    <div class="legend-row">
        <span class="legend-color very-high"></span>
        خیلی زیاد — 38 تا کمتر از 50
    </div>

    <div class="legend-row">
        <span class="legend-color severe"></span>
        شدید — 50 تا 70
    </div>

    <div class="legend-row">
        <span class="legend-color very-severe"></span>
        بسیار شدید — بیشتر از 70
    </div>

</div>


<button
    class="fars-button"
    id="farsButton"
>
    نمایش کل استان فارس
</button>


<div id="map"></div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


<script>

/*
==================================================
تنظیمات
==================================================
*/

const FWI_DATE = "2026-08-21";

const FARS_FILE = "fars.geojson";

const PROTECTED_FILE = "protected_areas.geojson";

const HUNTING_FILE = "hunting_banned.geojson";


/*
==================================================
ایجاد نقشه
==================================================
*/

const map = L.map("map", {

    zoomControl: true,

    maxBoundsViscosity: 1.0

});


/*
==================================================
نقشه پایه
==================================================
*/

const baseMap = L.tileLayer(

    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

    {

        maxZoom: 14,

        attribution:
            '&copy; OpenStreetMap contributors'

    }

);

baseMap.addTo(map);


/*
==================================================
متغیر لایه‌ها
==================================================
*/

let farsLayer = null;

let protectedLayer = null;

let huntingLayer = null;

let fwiLayer = null;

let fwiMask = null;

let farsBounds = null;


/*
==================================================
پنجره‌های Leaflet برای کنترل ترتیب لایه‌ها
==================================================
*/

map.createPane("fwiPane");

map.getPane("fwiPane").style.zIndex = 350;


map.createPane("fwiMaskPane");

map.getPane("fwiMaskPane").style.zIndex = 400;

map.getPane("fwiMaskPane").style.pointerEvents = "none";


map.createPane("protectedPane");

map.getPane("protectedPane").style.zIndex = 450;


map.createPane("huntingPane");

map.getPane("huntingPane").style.zIndex = 460;


map.createPane("farsPane");

map.getPane("farsPane").style.zIndex = 470;


/*
==================================================
استایل مرز فارس
==================================================
*/

const farsStyle = {

    color: "#222222",

    weight: 3,

    opacity: 1,

    fill: false,

    pane: "farsPane"

};


/*
==================================================
Popup
==================================================
*/

function createPopup(

    properties,

    type

) {

    properties = properties || {};


    const name =

        properties.name ||

        properties.NAME ||

        properties.Name ||

        properties.name_fa ||

        properties.NAME_FA ||

        properties.title ||

        properties.Title ||

        "نام منطقه ثبت نشده";


    return `

        <div>

            <div class="popup-title">

                ${name}

            </div>


            <div class="popup-row">

                <b>نوع منطقه:</b>

                ${type}

            </div>


            <div class="popup-row">

                <b>FWI:</b>

                در حال اتصال به داده عددی

            </div>


            <div class="popup-row">

                <b>سطح خطر:</b>

                در حال محاسبه

            </div>

        </div>

    `;

}


/*
==================================================
استخراج حلقه‌های GeoJSON فارس
==================================================
*/

function collectPolygonRings(

    geometry,

    result = []

) {

    if (!geometry) {

        return result;

    }


    if (geometry.type === "Polygon") {

        geometry.coordinates.forEach(

            ring => {

                result.push(ring);

            }

        );

    }


    else if (
        geometry.type === "MultiPolygon"
    ) {

        geometry.coordinates.forEach(

            polygon => {

                polygon.forEach(

                    ring => {

                        result.push(ring);

                    }

                );

            }

        );

    }


    return result;

}


/*
==================================================
تبدیل مختصات GeoJSON به مختصات صفحه Leaflet
==================================================
*/

function ringToPath(

    ring

) {

    if (!ring || !ring.length) {

        return "";

    }


    let path = "";


    ring.forEach(

        (coordinate, index) => {

            const lat =
                coordinate[1];

            const lng =
                coordinate[0];


            const point =
                map.latLngToContainerPoint(
                    [lat, lng]
                );


            if (index === 0) {

                path +=
                    `M ${point.x} ${point.y} `;

            }

            else {

                path +=
                    `L ${point.x} ${point.y} `;

            }

        }

    );


    path += "Z ";

    return path;

}


/*
==================================================
ساخت ماسک واقعی فارس
==================================================
*/

function createFwiMask(

    geojson

) {

    if (fwiMask) {

        fwiMask.remove();

        fwiMask = null;

    }


    /*
    ----------------------------------------------
    ساخت پنجره SVG
    ----------------------------------------------
    */

    const pane =
        map.getPane("fwiMaskPane");


    const svg =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "svg"
        );


    svg.style.position = "absolute";

    svg.style.top = "0";

    svg.style.left = "0";

    svg.style.width = "100%";

    svg.style.height = "100%";

    svg.style.pointerEvents = "none";


    pane.innerHTML = "";

    pane.appendChild(svg);


    /*
    ----------------------------------------------
    ساخت Path
    ----------------------------------------------
    */

    const path =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "path"
        );


    path.setAttribute(
        "fill",
        "rgba(255,255,255,1)"
    );


    path.setAttribute(
        "fill-rule",
        "evenodd"
    );


    path.setAttribute(
        "clip-rule",
        "evenodd"
    );


    svg.appendChild(path);


    /*
    ----------------------------------------------
    تابع به‌روزرسانی ماسک
    ----------------------------------------------
    */

    function updateMask() {

        const size =
            map.getSize();


        const outerPath =

            `M 0 0
             L ${size.x} 0
             L ${size.x} ${size.y}
             L 0 ${size.y}
             Z `;


        let provincePath = "";


        geojson.features.forEach(

            feature => {

                provincePath +=
                    collectPolygonRings(
                        feature.geometry
                    )
                    .map(
                        ringToPath
                    )
                    .join(" ");

            }

        );


        path.setAttribute(

            "d",

            outerPath + provincePath

        );

    }


    updateMask();


    map.on(
        "zoom move resize",
        updateMask
    );


    fwiMask = {

        remove: function() {

            map.off(
                "zoom move resize",
                updateMask
            );

            pane.innerHTML = "";

        },

        update: updateMask

    };

}


/*
==================================================
بارگذاری مرز استان فارس
==================================================
*/

fetch(
    FARS_FILE + "?v=20260820"
)

    .then(response => {

        if (!response.ok) {

            throw new Error(
                "خطا در دریافت fars.geojson"
            );

        }

        return response.json();

    })

    .then(data => {

        /*
        ------------------------------------------
        لایه مرز فارس
        ------------------------------------------
        */

        farsLayer = L.geoJSON(

            data,

            {

                style: farsStyle

            }

        );


        farsLayer.addTo(map);


        /*
        ------------------------------------------
        محدوده استان
        ------------------------------------------
        */

        farsBounds =
            farsLayer.getBounds();


        if (!farsBounds.isValid()) {

            throw new Error(
                "fars.geojson معتبر نیست."
            );

        }


        /*
        ------------------------------------------
        نمایش کل فارس
        ------------------------------------------
        */

        map.fitBounds(

            farsBounds,

            {

                padding: [25, 25]

            }

        );


        /*
        ------------------------------------------
        محدود کردن حرکت نقشه
        ------------------------------------------
        */

        map.setMaxBounds(

            farsBounds.pad(0.05)

        );


        /*
        ------------------------------------------
        ایجاد FWI
        ------------------------------------------
        */

        fwiLayer =
            L.tileLayer.wms(

                "https://maps.effis.emergency.copernicus.eu/gwis",

                {

                    layers:
                        "ecmwf.fwi",

                    format:
                        "image/png",

                    transparent:
                        true,

                    version:
                        "1.1.1",

                    time:
                        FWI_DATE,

                    opacity:
                        0.68,

                    pane:
                        "fwiPane",

                    bounds:
                        farsBounds,

                    keepBuffer:
                        0,

                    updateWhenIdle:
                        true,

                    updateWhenZooming:
                        false,

                    attribution:
                        "Copernicus / GWIS / ECMWF"

                }

            );


        /*
        ------------------------------------------
        نمایش FWI
        ------------------------------------------
        */

        fwiLayer.addTo(map);


        /*
        ------------------------------------------
        ساخت ماسک واقعی
        ------------------------------------------
        */

        createFwiMask(data);

    })

    .catch(error => {

        console.error(

            "Fars boundary error:",

            error

        );

    });


/*
==================================================
مناطق چهارگانه
==================================================
*/

fetch(
    PROTECTED_FILE + "?v=20260820"
)

    .then(response => {

        if (!response.ok) {

            throw new Error(
                "خطا در دریافت protected_areas.geojson"
            );

        }

        return response.json();

    })

    .then(data => {

        protectedLayer =
            L.geoJSON(

                data,

                {

                    pane:
                        "protectedPane",

                    style: {

                        color:
                            "#0066cc",

                        weight:
                            2,

                        fillColor:
                            "#0088ff",

                        fillOpacity:
                            0.12

                    },

                    onEachFeature:

                        function(
                            feature,
                            layer
                        ) {

                            layer.bindPopup(

                                createPopup(

                                    feature.properties,

                                    "منطقه چهارگانه"

                                )

                            );

                        }

                }

            );

    })

    .catch(error => {

        console.error(

            "Protected areas error:",

            error

        );

    });


/*
==================================================
مناطق شکار ممنوع
==================================================
*/

fetch(
    HUNTING_FILE + "?v=20260820"
)

    .then(response => {

        if (!response.ok) {

            throw new Error(
                "خطا در دریافت hunting_banned.geojson"
            );

        }

        return response.json();

    })

    .then(data => {

        huntingLayer =
            L.geoJSON(

                data,

                {

                    pane:
                        "huntingPane",

                    style: {

                        color:
                            "#7b1fa2",

                        weight:
                            2,

                        fillColor:
                            "#9c27b0",

                        fillOpacity:
                            0.12

                    },

                    onEachFeature:

                        function(
                            feature,
                            layer
                        ) {

                            layer.bindPopup(

                                createPopup(

                                    feature.properties,

                                    "منطقه شکار ممنوع"

                                )

                            );

                        }

                }

            );

    })

    .catch(error => {

        console.error(

            "Hunting areas error:",

            error

        );

    });


/*
==================================================
فیلتر FWI
==================================================
*/

document

    .getElementById(
        "fwiToggle"
    )

    .addEventListener(

        "change",

        function() {

            if (!fwiLayer) {

                return;

            }


            if (this.checked) {

                fwiLayer.addTo(map);

                if (fwiMask) {

                    fwiMask.update();

                }

            }

            else {

                map.removeLayer(
                    fwiLayer
                );

            }

        }

    );


/*
==================================================
فیلتر مناطق چهارگانه
==================================================
*/

document

    .getElementById(
        "protectedToggle"
    )

    .addEventListener(

        "change",

        function() {

            if (!protectedLayer) {

                return;

            }


            if (this.checked) {

                protectedLayer.addTo(map);

            }

            else {

                map.removeLayer(
                    protectedLayer
                );

            }

        }

    );


/*
==================================================
فیلتر شکار ممنوع
==================================================
*/

document

    .getElementById(
        "huntingToggle"
    )

    .addEventListener(

        "change",

        function() {

            if (!huntingLayer) {

                return;

            }


            if (this.checked) {

                huntingLayer.addTo(map);

            }

            else {

                map.removeLayer(
                    huntingLayer
                );

            }

        }

    );


/*
==================================================
فیلتر مرز فارس
==================================================
*/

document

    .getElementById(
        "farsToggle"
    )

    .addEventListener(

        "change",

        function() {

            if (!farsLayer) {

                return;

            }


            if (this.checked) {

                farsLayer.addTo(map);

            }

            else {

                map.removeLayer(
                    farsLayer
                );

            }

        }

    );


/*
==================================================
دکمه نمایش کل فارس
==================================================
*/

document

    .getElementById(
        "farsButton"
    )

    .addEventListener(

        "click",

        function() {

            if (!farsLayer) {

                return;

            }


            const bounds =
                farsLayer.getBounds();


            if (bounds.isValid()) {

                map.fitBounds(

                    bounds,

                    {

                        padding:
                            [25, 25]

                    }

                );

            }

        }

    );

</script>

</body>
</html>
