```html
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>سامانه خطر حریق استان فارس</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
*{box-sizing:border-box}
html,body,#map{margin:0;width:100%;height:100%}
body{font-family:"B Nazanin",Tahoma,sans-serif}

header{
  position:absolute;
  top:0;left:0;right:0;
  height:62px;
  z-index:2000;
  background:#f57c00;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
}
header h1{margin:0;font-size:22px}

#map{padding-top:62px}

.panel,.legend{
  position:absolute;
  top:75px;
  z-index:2000;
  background:#fff;
  padding:10px 12px;
  border-radius:10px;
  box-shadow:0 2px 10px #0003;
}

.panel{right:10px;width:210px}
.legend{left:10px;width:205px}

.panel b,.legend b{
  display:block;
  margin-bottom:7px
}

label{
  display:block;
  margin:7px 0;
  cursor:pointer
}

.legend div{
  margin:5px 0;
  font-size:13px
}

.color{
  display:inline-block;
  width:20px;
  height:12px;
  margin-left:5px;
  vertical-align:middle;
  border:1px solid #999
}

.low{background:#2ca25f}
.mod{background:#ffff00}
.high{background:#ff9900}
.vhigh{background:#ff0000}
.severe{background:#cc00cc}
.vsevere{background:#7a001f}

@media(max-width:700px){
  header h1{font-size:17px}
  .panel{width:175px}
  .legend{width:175px}
}
</style>
</head>

<body>

<header>
  <h1>سامانه پایش و پیش‌بینی خطر حریق استان فارس</h1>
</header>

<div class="panel">
  <b>لایه‌ها</b>

  <label>
    <input id="fwi" type="checkbox" checked>
    خطر حریق FWI
  </label>

  <label>
    <input id="protected" type="checkbox">
    مناطق چهارگانه
  </label>

  <label>
    <input id="hunting" type="checkbox">
    مناطق شکار ممنوع
  </label>

  <label>
    <input id="border" type="checkbox" checked>
    مرز استان فارس
  </label>
</div>

<div class="legend">
  <b>طبقات FWI</b>

  <div><span class="color low"></span>کم — کمتر از 11.2</div>
  <div><span class="color mod"></span>متوسط — 11.2 تا کمتر از 21.3</div>
  <div><span class="color high"></span>زیاد — 21.3 تا کمتر از 38</div>
  <div><span class="color vhigh"></span>خیلی زیاد — 38 تا کمتر از 50</div>
  <div><span class="color severe"></span>شدید — 50 تا 70</div>
  <div><span class="color vsevere"></span>بسیار شدید — بیشتر از 70</div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const map=L.map("map").setView([29.6,52.5],7);

L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {attribution:"© OpenStreetMap"}
).addTo(map);


/* پنل‌ها */

map.createPane("fwiPane").style.zIndex=350;
map.createPane("protectedPane").style.zIndex=400;
map.createPane("huntingPane").style.zIndex=410;
map.createPane("maskPane").style.zIndex=500;
map.createPane("borderPane").style.zIndex=510;


/* فایل فارس */

fetch("fars.geojson?v=2")
.then(r=>r.json())
.then(fars=>{

  const border=L.geoJSON(fars,{
    pane:"borderPane",
    style:{
      color:"#222",
      weight:3,
      fill:false
    }
  }).addTo(map);

  const bounds=border.getBounds();

  map.fitBounds(bounds);
  map.setMaxBounds(bounds.pad(.02));


  /* FWI فقط در محدوده فارس */

  const fwi=L.tileLayer.wms(
    "https://maps.effis.emergency.copernicus.eu/gwis",
    {
      layers:"ecmwf.fwi",
      format:"image/png",
      transparent:true,
      version:"1.1.1",
      time:"2026-08-21",
      opacity:.68,
      pane:"fwiPane",
      bounds:bounds
    }
  ).addTo(map);


  /*
     ماسک:
     بیرون فارس پوشانده می‌شود.
     داخل فارس شفاف می‌ماند.
  */

  const rings=[];

  fars.features.forEach(feature=>{

    const g=feature.geometry;

    if(g.type==="Polygon"){
      g.coordinates.forEach(r=>rings.push(
        r.map(p=>[p[1],p[0]])
      ));
    }

    if(g.type==="MultiPolygon"){
      g.coordinates.forEach(poly=>{
        poly.forEach(r=>rings.push(
          r.map(p=>[p[1],p[0]])
        ));
      });
    }
  });


  const world=[
    [89,-179],
    [89,179],
    [-89,179],
    [-89,-179]
  ];


  const mask=L.polygon(
    [world,...rings],
    {
      pane:"maskPane",
      stroke:false,
      fillColor:"#f4f4f4",
      fillOpacity:1,
      interactive:false
    }
  ).addTo(map);


  /* مناطق چهارگانه */

  fetch("protected_areas.geojson?v=2")
  .then(r=>r.json())
  .then(data=>{

    const layer=L.geoJSON(data,{
      pane:"protectedPane",
      style:{
        color:"#0066cc",
        weight:2,
        fillColor:"#0088ff",
        fillOpacity:.18
      },
      onEachFeature:(feature,l)=>{

        const p=feature.properties||{};

        const name=
          p.name||p.NAME||p.Name||
          p.name_fa||p.NAME_FA||
          p.title||p.Title||
          "نام منطقه";

        l.bindPopup(`
          <b>${name}</b><br>
          نوع: مناطق چهارگانه
        `);
      }
    });

    window.protectedLayer=layer;
  });


  /* مناطق شکار ممنوع */

  fetch("hunting_banned.geojson?v=2")
  .then(r=>r.json())
  .then(data=>{

    const layer=L.geoJSON(data,{
      pane:"huntingPane",
      style:{
        color:"#8e24aa",
        weight:2,
        fillColor:"#ab47bc",
        fillOpacity:.18
      },
      onEachFeature:(feature,l)=>{

        const p=feature.properties||{};

        const name=
          p.name||p.NAME||p.Name||
          p.name_fa||p.NAME_FA||
          p.title||p.Title||
          "نام منطقه";

        l.bindPopup(`
          <b>${name}</b><br>
          نوع: مناطق شکار ممنوع
        `);
      }
    });

    window.huntingLayer=layer;
  });


  /* فیلتر FWI */

  document.getElementById("fwi").onchange=e=>{
    e.target.checked ? fwi.addTo(map) : map.removeLayer(fwi);
  };


  /* فیلتر چهارگانه */

  document.getElementById("protected").onchange=e=>{

    if(!window.protectedLayer)return;

    e.target.checked
      ? window.protectedLayer.addTo(map)
      : map.removeLayer(window.protectedLayer);
  };


  /* فیلتر شکار ممنوع */

  document.getElementById("hunting").onchange=e=>{

    if(!window.huntingLayer)return;

    e.target.checked
      ? window.huntingLayer.addTo(map)
      : map.removeLayer(window.huntingLayer);
  };


  /* فیلتر مرز */

  document.getElementById("border").onchange=e=>{

    e.target.checked
      ? border.addTo(map)
      : map.removeLayer(border);
  };

});

</script>
</body>
</html>
